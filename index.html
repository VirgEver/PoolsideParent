<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Poolside Parent - Alpha 2.1.0 Test</title><link rel="stylesheet" href="css/main.css"><style>
#setupScreen{padding-bottom:120px}.row{flex-direction:row;align-items:center}.row label{margin-bottom:0}#setupScreen select{width:18ch}.swimmerSelectWrap{display:flex;align-items:center;gap:8px}.swimmerSelectWrap select{width:18ch}.swimmerAddButton{width:38px!important;min-width:38px!important;height:38px!important;min-height:38px!important;margin:0!important;padding:0!important;font-size:24px!important;line-height:1!important;border-radius:8px}.checkboxRow{justify-content:flex-start;gap:12px}.checkboxRow label{white-space:nowrap}.setupSecondaryActions{display:flex;justify-content:center;align-items:center;gap:12px;margin:0 auto 14px}.setupSecondaryActions button{margin:0}
#manualButton,#historyButton{box-sizing:border-box!important;flex:1 1 0!important;width:0!important;min-width:0!important;height:46px!important;min-height:46px!important;max-height:46px!important;margin:0!important;padding:4px!important;font-family:inherit!important;font-size:16px!important;font-weight:700!important;line-height:1.1!important;white-space:nowrap!important;overflow:hidden!important}
#resultScreen{padding-bottom:120px}#resultScreen>.resultScreenTitle{text-align:center;margin:0 0 12px;font-size:24px}.resultButtons{display:flex!important;align-items:stretch!important;gap:12px!important;margin-top:18px;margin-bottom:10px}.resultTopButtons{display:contents!important}.resultButtons button{box-sizing:border-box!important;flex:1 1 0!important;width:calc((100% - 12px)/2)!important;min-width:0!important;max-width:calc((100% - 12px)/2)!important;height:54px!important;min-height:54px!important;max-height:54px!important;margin:0!important;padding:4px!important;font-family:inherit!important;font-size:15px!important;font-weight:700!important;line-height:1.1!important;white-space:normal!important;overflow:hidden!important;display:flex!important;align-items:center!important;justify-content:center!important}.resultButtons #newSwimButton{background:#2e7d32!important;color:#fff!important}.resultButtons #discardResultButton{background:#c62828!important;color:#fff!important}
#manualScreen{padding-bottom:120px}#manualScreen .panel{padding:14px}#manualScreen .row{flex-direction:row;align-items:center;justify-content:space-between;margin-bottom:10px}#manualScreen .row label{font-size:18px;font-weight:bold;margin:0}#manualScreen select{width:18ch;height:2.2em;font-size:18px;padding-left:6px;border-radius:8px}#manualScreen input[type=date]{width:18ch;height:2.2em;font-size:18px;padding:2px 6px;border-radius:8px;box-sizing:border-box}#manualScreen .manualTimeEntry{width:18ch;max-width:100%;display:flex;align-items:center;justify-content:flex-end;gap:2px;margin:0}#manualScreen .manualTimeEntry input{width:4.5ch!important;height:2.2em!important;font-size:18px!important;padding:2px!important;text-align:center;box-sizing:border-box}.manualTimeEntry span{font-size:18px;font-weight:bold;line-height:1}
#cancelManualButton{box-sizing:border-box!important;height:54px!important;min-height:54px!important;padding:4px 12px!important;font-size:18px!important;font-weight:700!important;background:#c62828!important;color:#fff!important}#setupScreen .footer,#timingScreen .footer,#resultScreen .footer,#manualScreen .footer{display:none!important}
#resultScreen .pbBox{display:grid;grid-template-columns:1fr 1fr;column-gap:12px;align-items:start;text-align:left}#resultScreen .pbBox .pbTitle{margin:0;font-weight:700}#resultScreen .pbBox .pbDifference{grid-column:2;grid-row:1/span 2;margin:0;text-align:right;font-weight:700}#resultScreen .pbBox .pbDifference .differenceTime{display:block;margin-top:3px;font-weight:400}
.historyFilterPanel{background:#fff;border:1px solid #d6dbe1;border-radius:12px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.10)}.historyFilterSection{margin-bottom:14px}.historyFilterSection:last-of-type{margin-bottom:10px}.historyFilterHeading{font-size:14px;font-weight:700;margin-bottom:7px;color:#444}.historyFilterOptions{display:flex;flex-wrap:wrap;gap:7px}.historyFilterOption,#historyPBOption{width:auto!important;height:38px!important;min-height:38px!important;padding:0 12px!important;margin:0!important;border:1px solid #b9c2cc!important;border-radius:10px!important;background:#f4f6f8!important;color:#222!important;font-size:14px!important}.historyFilterOption.selected,#historyPBOption.selected{background:#1976d2!important;border-color:#1976d2!important;color:#fff!important}.historyFilterFooter{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.historyFilterFooter button{height:46px!important;margin:0!important;font-size:15px!important}.historyFilterClear{background:#6b7280!important;color:#fff!important}.historyFilterApply{background:#2e7d32!important;color:#fff!important}.historyFilterStatus{text-align:center;font-size:13px;font-weight:700;color:#555;line-height:1.3;margin-top:-3px;margin-bottom:1px;padding:0 4px}.historyFilterButton.activeFilter{background:#d97706!important;border-color:#b45309!important;color:#fff!important}
@media(max-width:430px){#setupScreen select{max-width:55%}.swimmerSelectWrap{max-width:58%}.swimmerSelectWrap select{max-width:none!important;width:calc(100% - 46px)!important}.setupSecondaryActions{gap:10px}#manualButton,#historyButton{width:0!important;max-width:none!important}.resultButtons{gap:10px!important}.resultButtons button{width:calc((100% - 10px)/2)!important;max-width:calc((100% - 10px)/2)!important;font-size:15px!important}#manualScreen .panel{padding:12px}#manualScreen .row{margin-bottom:8px}#manualScreen .row label{font-size:18px}#manualScreen select,#manualScreen input[type=date]{width:18ch;max-width:55%;font-size:18px}#manualScreen .manualTimeEntry{width:auto;max-width:55%;justify-content:flex-end;gap:1px}#manualScreen .manualTimeEntry input{width:4.2ch!important;font-size:17px!important}#manualScreen .manualTimeEntry span{font-size:17px}.historyFilterPanel{padding:10px}.historyFilterOption,#historyPBOption{min-height:40px!important;height:40px!important;font-size:14px!important;padding:0 10px!important}}
</style></head><body><div class="app">
<section id="setupScreen"><header class="header"><h1>🏊 Poolside Parent</h1></header><div class="panel"><div class="row"><label for="swimmer">Swimmer</label><div class="swimmerSelectWrap"><button type="button" id="addSwimmerButton" class="secondaryButton swimmerAddButton" aria-label="Add swimmer">+</button><select id="swimmer"></select></div></div><div class="row"><label for="stroke">Stroke</label><select id="stroke"><option>Freestyle</option><option>Backstroke</option><option>Breaststroke</option><option>Butterfly</option><option>IM</option></select></div><div class="row"><label for="distance">Distance</label><select id="distance"><option>25m</option><option>50m</option><option>100m</option><option>200m</option><option>400m</option></select></div><div class="row"><label for="course">Pool</label><select id="course"><option>25m</option><option>50m</option></select></div><div class="row checkboxRow"><input type="checkbox" id="showPB" checked><label for="showPB">Show PB</label></div></div><button id="startButton" class="primaryButton">START TIMER</button><div class="setupSecondaryActions"><button id="manualButton" class="secondaryButton">MANUAL TIME</button><button id="historyButton" class="smallButton">HISTORY</button></div></section>
<section id="timingScreen" class="hidden"><div class="sessionHeader"><div id="sessionSwimmer" class="swimmerName"></div><div id="sessionEvent" class="eventName"></div></div><div id="timerDisplay">00:00.00</div><div class="buttonPanel"><button id="splitButton" class="secondaryButton">SPLIT</button><button id="stopButton" class="dangerButton">STOP</button></div><div id="splitContainer"></div></section>
<section id="resultScreen" class="hidden"><h2 class="resultScreenTitle">Swim Result</h2><div id="summaryCard" class="summaryCard"></div><div class="buttonArea resultButtons"><div class="resultTopButtons"><button id="newSwimButton">SAVE &amp;<br>NEW SWIM</button></div><button id="discardResultButton">DISCARD<br>SWIM</button></div></section>
<section id="manualScreen" class="hidden"><h2>Manual Result</h2><div class="panel"><div class="row"><label>Swimmer</label><select id="manualSwimmer"></select></div><div class="row"><label>Stroke</label><select id="manualStroke"><option>Freestyle</option><option>Backstroke</option><option>Breaststroke</option><option>Butterfly</option><option>IM</option></select></div><div class="row"><label>Distance</label><select id="manualDistance"><option>25m</option><option>50m</option><option>100m</option><option>200m</option><option>400m</option></select></div><div class="row"><label>Pool</label><select id="manualCourse"><option>25m</option><option>50m</option></select></div><div class="row"><label>Result Type</label><select id="manualSource"><option value="parent">Parent</option><option value="coach">Coach</option><option value="official">Official Gala</option><option value="historical">Historical</option></select></div><div class="row"><label>Date</label><input id="manualDate" type="date"></div><div class="row finalTimeRow"><label>Final Time</label><div class="manualTimeEntry"><input id="manualMinutes" type="number" min="0" max="59" placeholder="00"><span>:</span><input id="manualSeconds" type="number" min="0" max="59" placeholder="00"><span>.</span><input id="manualHundredths" type="number" min="0" max="99" placeholder="00"></div></div></div><button id="saveManualButton" class="primaryButton">SAVE RESULT</button><button id="cancelManualButton" class="secondaryButton">CANCEL</button></section>
<section id="historyScreen" class="hidden"><h2>Swim History</h2><div class="historyActions"><button id="shareHistoryButton" class="secondaryButton">SHARE HISTORY</button><button id="mergeHistoryButton" class="secondaryButton">ADD / MERGE HISTORY</button><button id="filterHistoryButton" class="secondaryButton historyFilterButton" aria-expanded="false">FILTER</button><div id="historyFilterStatus" class="historyFilterStatus hidden" aria-live="polite"></div><div id="historyFilterPanel" class="historyFilterPanel hidden">
<div class="historyFilterSection"><div class="historyFilterHeading">SWIMMER</div><div id="historySwimmerOptions" class="historyFilterOptions" role="group" aria-label="Filter history by swimmer"></div></div>
<div class="historyFilterSection"><div class="historyFilterHeading">STROKE</div><div class="historyFilterOptions" role="group" aria-label="Filter history by stroke"><button type="button" class="historyFilterOption" data-category="strokes" data-value="All">All</button><button type="button" class="historyFilterOption" data-category="strokes" data-value="Freestyle">Freestyle</button><button type="button" class="historyFilterOption" data-category="strokes" data-value="Backstroke">Backstroke</button><button type="button" class="historyFilterOption" data-category="strokes" data-value="Breaststroke">Breaststroke</button><button type="button" class="historyFilterOption" data-category="strokes" data-value="Butterfly">Butterfly</button><button type="button" class="historyFilterOption" data-category="strokes" data-value="IM">IM</button></div></div>
<div class="historyFilterSection"><div class="historyFilterHeading">DISTANCE</div><div class="historyFilterOptions" role="group" aria-label="Filter history by distance"><button type="button" class="historyFilterOption" data-category="distances" data-value="All">All</button><button type="button" class="historyFilterOption" data-category="distances" data-value="25m">25m</button><button type="button" class="historyFilterOption" data-category="distances" data-value="50m">50m</button><button type="button" class="historyFilterOption" data-category="distances" data-value="100m">100m</button><button type="button" class="historyFilterOption" data-category="distances" data-value="200m">200m</button><button type="button" class="historyFilterOption" data-category="distances" data-value="400m">400m</button></div></div>
<div class="historyFilterSection"><div class="historyFilterHeading">POOL</div><div class="historyFilterOptions" role="group" aria-label="Filter history by pool length"><button type="button" class="historyFilterOption" data-category="courses" data-value="All">All</button><button type="button" class="historyFilterOption" data-category="courses" data-value="25m">25m</button><button type="button" class="historyFilterOption" data-category="courses" data-value="50m">50m</button></div></div>
<div class="historyFilterSection"><div class="historyFilterHeading">PERFORMANCE</div><div class="historyFilterOptions"><button type="button" id="historyPBOption" aria-pressed="false">PBs only</button></div></div>
<div class="historyFilterFooter"><button type="button" id="clearHistoryFiltersButton" class="historyFilterClear">CLEAR ALL</button><button type="button" id="applyHistoryFiltersButton" class="historyFilterApply">APPLY FILTERS</button></div>
</div><button id="closeHistoryButton" class="primaryButton">BACK</button><input type="file" id="historyFileInput" accept=".json,application/json" hidden></div><div id="mergeMessage" class="mergeMessage"></div><div id="historyContainer"></div></section>
<script src="js/storage.js"></script><script src="js/export.js"></script><script src="js/timer.js"></script><script src="js/manual-time.js"></script><script src="js/ui.js"></script><script src="js/swimmers.js"></script><script src="js/app.js"></script><script src="js/history-edit.js"></script><script src="js/result-edit.js"></script><script>(function(){function tidyDifference(){document.querySelectorAll('#resultScreen .pbDifference').forEach(function(el){if(el.querySelector('.differenceTime'))return;var t=el.textContent.trim(),p='Difference:';if(t.indexOf(p)!==0)return;el.innerHTML="<span class='differenceTitle'>Difference:</span><span class='differenceTime'>"+t.slice(p.length).trim()+"</span>"})}var c=document.getElementById('summaryCard');if(c){new MutationObserver(tidyDifference).observe(c,{childList:true,subtree:true});tidyDifference()}})();</script></div></body></html>
