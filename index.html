<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Poolside Parent - Alpha 1.3.4
    </title>

    <link
        rel="stylesheet"
        href="css/main.css">

    <style>
        /* =====================================================
           Alpha 1.3.4
           Main Screen UI + Swimmer Management
        ===================================================== */

        #setupScreen{
            padding-bottom:120px;
        }

        #setupScreen .row{
            flex-direction:row;
            align-items:center;
        }

        #setupScreen .row label{
            margin-bottom:0;
        }

        #setupScreen select{
            width:18ch;
        }

        #setupScreen .checkboxRow{
            justify-content:flex-start;
            gap:12px;
        }

        #setupScreen .checkboxRow label{
            white-space:nowrap;
        }

        .swimmerControl{
            display:flex;
            align-items:center;
            gap:8px;
        }

        .swimmerControl select{
            margin:0;
        }

        #addSwimmerButton{
            width:42px;
            height:42px;
            min-width:42px;
            padding:0;
            margin:0;
            font-size:24px;
            line-height:1;
        }

        .setupSecondaryActions{
            display:flex;
            justify-content:center;
            align-items:center;
            gap:12px;
            margin:0 auto 14px auto;
        }

        .setupSecondaryActions button{
            margin:0;
        }

        #manualButton{
            width:14ch;
            height:46px;
            font-size:16px;
        }

        #historyButton{
            width:12ch;
            height:46px;
            margin:0;
        }

        @media(max-width:430px){
            #setupScreen .row{
                flex-direction:row;
            }

            #setupScreen select{
                width:18ch;
                max-width:55%;
            }
        }
    </style>

</head>

<body>

<div class="app">


    <!-- =====================================================
         SCREEN 1: SETUP
    ====================================================== -->

    <section id="setupScreen">

        <header class="header">

            <h1>
                🏊 Poolside Parent
            </h1>

        </header>


        <div class="panel">

            <div class="row">

                <label for="swimmer">
                    Swimmer
                </label>

                <div class="swimmerControl">

                    <select id="swimmer">
                    </select>

                    <button
                        id="addSwimmerButton"
                        class="smallButton"
                        type="button"
                        aria-label="Add swimmer"
                        title="Add swimmer">
                        +
                    </button>

                </div>

            </div>


            <div class="row">

                <label for="stroke">
                    Stroke
                </label>

                <select id="stroke">

                    <option>
                        Freestyle
                    </option>

                    <option>
                        Backstroke
                    </option>

                    <option>
                        Breaststroke
                    </option>

                    <option>
                        Butterfly
                    </option>

                    <option>
                        IM
                    </option>

                </select>

            </div>


            <div class="row">

                <label for="distance">
                    Distance
                </label>

                <select id="distance">

                    <option>
                        25m
                    </option>

                    <option>
                        50m
                    </option>

                    <option>
                        100m
                    </option>

                    <option>
                        200m
                    </option>

                    <option>
                        400m
                    </option>

                </select>

            </div>


            <div class="row">

                <label for="course">
                    Pool
                </label>

                <select id="course">

                    <option>
                        25m
                    </option>

                    <option>
                        50m
                    </option>

                </select>

            </div>


            <div class="row checkboxRow">

                <input
                    type="checkbox"
                    id="showPB"
                    checked>

                <label for="showPB">
                    Show PB
                </label>

            </div>

        </div>


        <button
            id="startButton"
            class="primaryButton">
            START TIMER
        </button>


        <div class="setupSecondaryActions">

            <button
                id="manualButton"
                class="secondaryButton">
                MANUAL TIME
            </button>

            <button
                id="historyButton"
                class="smallButton">
                HISTORY
            </button>

        </div>


        <div class="footer">
            Alpha 1.3.4&nbsp;&nbsp;|&nbsp;&nbsp;Screen 1 of 3
        </div>

    </section>


    <!-- =====================================================
         SCREEN 2: TIMING
    ====================================================== -->

    <section
        id="timingScreen"
        class="hidden">


        <div class="sessionHeader">

            <div
                id="sessionSwimmer"
                class="swimmerName">

            </div>


            <div
                id="sessionEvent"
                class="eventName">

            </div>

        </div>


        <div id="timerDisplay">
            00:00.00
        </div>


        <div class="buttonPanel">

            <button
                id="splitButton"
                class="secondaryButton">
                SPLIT
            </button>


            <button
                id="stopButton"
                class="dangerButton">
                STOP
            </button>

        </div>


        <div id="splitContainer">
        </div>


        <div class="footer">
            Alpha 1.3.4&nbsp;&nbsp;|&nbsp;&nbsp;Screen 2 of 3
        </div>

    </section>


    <!-- =====================================================
         SCREEN 3: RESULTS
    ====================================================== -->

    <section
        id="resultScreen"
        class="hidden">


        <div
            id="summaryCard"
            class="summaryCard">
        </div>


        <div class="buttonArea resultButtons">

            <div class="resultTopButtons">
                <button id="newSwimButton">
                    NEW SWIM
                </button>
            </div>

            <button id="discardResultButton">
                DISCARD SWIM
            </button>

        </div>


        <div class="footer">
            Alpha 1.3.4&nbsp;&nbsp;|&nbsp;&nbsp;Screen 3 of 3
        </div>

    </section>


    <!-- =====================================================
         SCREEN 4 : MANUAL RESULT
    ====================================================== -->

    <section
        id="manualScreen"
        class="hidden">

    <h2>
        Manual Result
    </h2>


    <div class="panel">

        <div class="row">
            <label>Swimmer</label>
            <select id="manualSwimmer">
            </select>
        </div>

        <div class="row">
            <label>Stroke</label>
            <select id="manualStroke">
                <option>Freestyle</option>
                <option>Backstroke</option>
                <option>Breaststroke</option>
                <option>Butterfly</option>
                <option>IM</option>
            </select>
        </div>

        <div class="row">
            <label>Distance</label>
            <select id="manualDistance">
                <option>25m</option>
                <option>50m</option>
                <option>100m</option>
                <option>200m</option>
                <option>400m</option>
            </select>
        </div>

        <div class="row">
            <label>Pool</label>
            <select id="manualCourse">
                <option>25m</option>
                <option>50m</option>
            </select>
        </div>

        <div class="row">
            <label>Result Type</label>
            <select id="manualSource">
                <option value="parent">Parent</option>
                <option value="coach">Coach</option>
                <option value="official">Official Gala</option>
                <option value="historical">Historical</option>
            </select>
        </div>

        <div class="row">
            <label>Date</label>
            <input id="manualDate" type="date">
        </div>

        <div class="row">
            <label>Final Time</label>

            <div class="manualTimeEntry">
                <input id="manualMinutes" type="number" min="0" max="59" placeholder="00">
                <span>:</span>
                <input id="manualSeconds" type="number" min="0" max="59" placeholder="00">
                <span>.</span>
                <input id="manualHundredths" type="number" min="0" max="99" placeholder="00">
            </div>
        </div>

    </div>


    <button
        id="saveManualButton"
        class="primaryButton">
        SAVE RESULT
    </button>


    <button
        id="cancelManualButton"
        class="secondaryButton">
        CANCEL
    </button>


    <div class="footer">
        Alpha 1.3.4&nbsp;&nbsp;|&nbsp;&nbsp;Screen 4 of 5
    </div>

</section>


<!-- =====================================================
     HISTORY SCREEN
====================================================== -->

<section
    id="historyScreen"
    class="hidden">

    <h2>
        Swim History
    </h2>


<div class="historyActions">

    <button
        id="shareHistoryButton"
        class="secondaryButton">
        SHARE HISTORY
    </button>

    <button
        id="mergeHistoryButton"
        class="secondaryButton">
        ADD / MERGE HISTORY
    </button>

    <button
        id="clearHistoryButton"
        class="secondaryButton clearButton">
        CLEAR HISTORY
    </button>

    <button
        id="closeHistoryButton"
        class="primaryButton">
        BACK
    </button>

    <input
        type="file"
        id="historyFileInput"
        accept=".json,application/json"
        hidden>

</div>


    <div
        id="mergeMessage"
        class="mergeMessage">
    </div>


    <div
        id="historyContainer">
    </div>


</section>


<script src="js/storage.js"></script>
<script src="js/swimmers.js"></script>
<script src="js/export.js"></script>
<script src="js/timer.js"></script>
<script src="js/manual-time.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>


<script>
    initialiseSwimmers();
</script>


</body>

</html>
